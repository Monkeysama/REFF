<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>状态示例 · REFF</title>
<style>
  :root { color-scheme: dark; font: 14px system-ui, sans-serif; background: #10151e; color: #e8eef7; }
  body { margin: 0; padding: 28px; } main { max-width: 680px; margin: auto; }
  header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #2c394b; padding-bottom:16px; }
  h1 { margin: 0; font-size: 22px; } p { color:#9daabd; } output { display:block; margin-top:24px; padding:20px; background:#182130; border:1px solid #2c394b; border-radius:6px; font-size:18px; }
  button { color:#dffaf4; background:#1c7367; border:0; border-radius:4px; padding:8px 12px; cursor:pointer; }
  .error { color:#ff9b9b; }
</style>
<main>
  <header><h1>状态示例</h1><button id="back" type="button" onclick="window.location.replace('reff://shell/index.html')">返回 REFF</button></header>
  <p id="identity">正在建立页面身份...</p>
  <output id="state">正在读取游戏状态...</output>
</main>
<script>
  // 通过 CEF 受控查询调用当前插件声明的方法，网页不携带身份字段。
  function call(method, params) {
    return new Promise((resolve, reject) => window.cefQuery({
      request: JSON.stringify({ method, params: params || {} }),
      onSuccess: raw => resolve(JSON.parse(raw)),
      onFailure: (code, reason) => reject(new Error(code + ': ' + reason))
    }));
  }
  // 加载身份和状态快照；宿主会拒绝跨插件方法或伪造身份请求。
  async function load() {
    try {
      const identity = await call('ui.identity');
      if (identity.kind !== 'plugin' || identity.pluginId !== 'example.status') throw new Error('插件页面身份不匹配');
      document.querySelector('#identity').textContent = '已绑定插件：' + identity.pluginId;
      const state = await call('example.status.get');
      document.querySelector('#state').textContent = '运行时间：' + state.uptime + ' 秒　设置修订：' + state.counter_revision + '　启用：' + (state.settings_enabled ? '是' : '否');
    } catch (error) {
      document.querySelector('#state').className = 'error';
      document.querySelector('#state').textContent = String(error);
    }
  }
  document.querySelector('#back').addEventListener('click', () => { window.location.href = 'reff://shell/index.html'; });
  void load();
</script>
</html>
