name: REFF Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '正式版本标签，必须匹配 version.json，例如 v1.0.0'
        required: true
        type: string
      publish:
        description: '回归通过后上传正式 Release（关闭时仅构建）'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: 校验正式版本标签
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$' -or $env:RELEASE_TAG -ne "v$version") { throw "标签必须匹配正式版本 v$version" }
          "REFF_VERSION=$version" >> $env:GITHUB_ENV

      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: web/shell/pnpm-lock.yaml

      - name: 安装 Web 依赖
        working-directory: web/shell
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: 准备锁定依赖
        shell: pwsh
        run: .\tools\fetch-dependencies.ps1

      - name: 构建默认 WebView2 后端
        shell: pwsh
        run: |
          .\tools\build-web.ps1 -IncludeExamples
          .\tools\build.ps1

      - name: 为独立浏览器回归准备共享 Runtime
        shell: pwsh
        run: |
          # CI 执行器显式准备依赖；用户游戏安装器不执行此下载/安装。
          $bootstrap = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrap
          $signature = Get-AuthenticodeSignature -LiteralPath $bootstrap
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Runtime 安装器签名无效' }
          $setup = Start-Process -FilePath $bootstrap -ArgumentList '/silent','/install' -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "共享 Runtime 准备失败：$($setup.ExitCode)" }

      - name: 独立浏览器和行为回归
        shell: pwsh
        run: |
          .\tools\test-webview2-p1.ps1 -BuildRoot .\build-webview2-release
          .\tools\test-webview2-p1.ps1 -BuildRoot .\build-webview2-release -Behavior

      - name: 生成并校验分发资产
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          .\tools\release.ps1 -Tag $env:RELEASE_TAG -SkipBuild
          .\tools\test-distribution.ps1
          .\tools\test-release-contract.ps1 -Archive (Join-Path 'artifacts' ('REFF-'+$env:RELEASE_TAG.TrimStart('v')+'.zip'))
          .\tools\test-examples-source.ps1

      - name: 上传构建资产与独立证据
        uses: actions/upload-artifact@v4
        with:
          name: REFF-WebView2
          path: |
            artifacts/REFF-${{ env.REFF_VERSION }}.zip
            artifacts/REFF-${{ env.REFF_VERSION }}.zip.sha256
            artifacts/webview2-p1/**/summary.json
            artifacts/webview2-p1/**/integration-summary.json
            artifacts/webview2-p1/**/smoke-summary.json
            artifacts/webview2-p4/**/summary.json

      - name: 发布正式版
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: .\tools\release.ps1 -Tag $env:RELEASE_TAG -SkipBuild -Publish
